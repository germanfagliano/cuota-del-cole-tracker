name: Actualizar indicadores y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # todos los días, 10:00 hora Argentina
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Baja los indicadores, los guarda en el repo y arma el artefacto de la página.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bajar IPC, dólar blue y RIPTE
        run: node scripts/actualizar-indicadores.mjs

      - name: Guardar datos nuevos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indicadores.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar IPC, dólar blue y RIPTE"
            # por si alguien subió un cambio a main mientras corría el job
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # Job aparte (patrón oficial de GitHub Pages): el artefacto ya está registrado cuando
  # arranca el deploy. En un mismo job, deploy-pages a veces no lo encontraba
  # ("No artifacts named github-pages were found") y la corrida fallaba.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
